<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ponto Eletrônico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Área para exibir data, hora e dia da semana -->
    <div>
        <p id="dia-semana"></p>
        <p id="data-atual"></p>
        <p id="hora-atual"></p>
    </div>

    <!-- Select para tipo de registro -->
    <select id="register-type">
        <option value="entrada">Entrada</option>
        <option value="intervalo">Intervalo</option>
        <option value="volta-intervalo">Volta Intervalo</option>
        <option value="saida">Saída</option>
    </select>

    <!-- Botão de registrar -->
    <button id="btn-registrar-ponto">Registrar Ponto</button>

    <!-- Mensagem de status -->
    <p id="mensagem"></p>

    <!-- Modal para o registro de ponto -->
    <dialog id="dialog-ponto">
        <p id="dialog-data"></p>
        <p id="dialog-hora"></p>
        <button id="btn-dialog-register">Confirmar Registro</button>
        <button id="dialog-fechar">X</button>
    </dialog>

    <script src="js/index.js"></script>
</body>
</html>
